# Build and publish to PyPI when a tag v* is pushed.
# Only src/kyro is packaged; tests/, scripts/, benchmarks/, examples/ are excluded by layout.
# Required: GitHub repo secret PYPI_API_TOKEN (PyPI API token, e.g. pypi-...).

name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Verify version matches tag
        run: |
          TAG="${{ github.ref_name }}"
          EXPECTED="${TAG#v}"
          ACTUAL=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "Version mismatch: tag $TAG implies $EXPECTED but pyproject.toml has $ACTUAL"
            exit 1
          fi

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*
