name: Benchmarks

on:
  push:
    branches: [main, master, testing]
  pull_request:
    branches: [main, master, testing]

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,bench]"

      - name: Run serialization benchmarks
        run: pytest benchmarks/bench_serialization.py -v --benchmark-only 2>&1 | tee benchmark_serialization.txt

      - name: Run REST client benchmarks
        run: pytest benchmarks/bench_rest_client.py -v --benchmark-only 2>&1 | tee benchmark_rest_client.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            benchmark_serialization.txt
            benchmark_rest_client.txt
